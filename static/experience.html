<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经验与偏好 · OpenHarvey</title><link rel="icon" href="/static/brand/openharvey.svg"><link rel="stylesheet" href="/static/experience.css"></head><body>
<header class="topbar"><a class="brand" href="/spaces"><img src="/static/brand/openharvey.svg" width="30" height="30" alt=""><span><b>OpenHarvey</b><small>OPENHARVEY</small></span></a><nav aria-label="主导航"><a href="/spaces">合同空间</a><a href="/experience" aria-current="page">经验与偏好</a><a href="/config">设置</a></nav></header>
<main><div class="intro"><div><p class="eyebrow">WORKING KNOWLEDGE</p><h1>经验与偏好</h1><p>把有依据的经验留下，让后续工作更贴近你的方式。</p></div><label class="team-picker"><span>当前团队</span><select id="team" aria-label="当前团队"></select></label></div>
<div class="actions"><button id="add" class="primary">＋ 添加个人内容</button><button id="newTeam" hidden>创建团队</button><button id="members" hidden>管理团队成员</button></div>
<nav class="tabs" aria-label="内容范围"><button data-tab="personal" aria-current="page">我的内容</button><button data-tab="team">团队内容</button><button data-tab="pending">待确认</button><button data-tab="legacy">历史版本</button><button data-tab="review">共享申请与审核</button></nav>
<p id="status" role="status" hidden></p><div id="content" aria-live="polite"></div>
<p class="footnote">确认内容表示允许在后续工作中参考，不代表合同事项获得批准。删除经验不会删除原始合同或对话。</p></main>
<dialog id="editor"><form id="editForm"><h2 id="editTitle">添加个人内容</h2><label>内容类别<select name="kind"><option value="experience">过往经验</option><option value="preference">工作偏好与约定</option></select></label><label>标题<input name="title" maxlength="160" required></label><label>风险主题或工作主题<input name="topic" maxlength="120"></label><label>内容<textarea name="content" rows="5" maxlength="12000" required></textarea></label><label>适用条件（每行一条）<textarea name="conditions" rows="3"></textarea></label><label>例外与限制（每行一条）<textarea name="exceptions" rows="2"></textarea></label><p id="editorHint"></p><div class="actions dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" id="save" class="primary">保存</button></div></form></dialog>
<dialog id="detail"><div id="detailContent"></div><div class="actions dialog-actions"><button id="closeDetail">关闭</button></div></dialog>
<dialog id="confirmDialog" class="dialog-sm"><form method="dialog"><h2 id="confirmTitle">确认删除</h2><p id="confirmMessage"></p><div class="actions dialog-actions"><button type="submit" value="cancel" id="confirmCancel" formnovalidate>取消</button><button type="submit" value="confirm" id="confirmOk" class="danger">确认删除</button></div></form></dialog>
<dialog id="teamDialog" class="dialog-sm"><form id="teamForm"><h2>创建团队</h2><label>团队名称<input id="teamName" name="name" maxlength="80" required placeholder="输入团队名称"></label><p id="teamHint" hidden></p><div class="actions dialog-actions"><button type="button" id="cancelTeam">取消</button><button type="submit" id="saveTeam" class="primary">创建</button></div></form></dialog><script type="module" src="/static/experience.js"></script></body></html>
